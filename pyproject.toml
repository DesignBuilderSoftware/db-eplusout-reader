[project]
name = "db-eplusout-reader"
version = "0.5.0"
description = "A tool to fetch results from EnergyPlus output files"
authors = [
    { name = "Vojtech Panek", email = "vojtech.panek@designbuilder.co.uk" },
    { name = "Bartłomiej Tokarzewski", email = "bartlomiej.tokarzewski@designbuilder.co.uk" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
parquet = ["pyarrow>=14"]

[dependency-groups]
dev = [
    "eppy>=0.5.69",
    "ruff>=0.9.0",
    "pylint>=3.0.3",
    "pre-commit>=3.6.1",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pyarrow>=14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["db_eplusout_reader"]

[tool.ruff]
line-length = 96
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C90", # mccabe complexity
]
ignore = ["E203"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["db_eplusout_reader"]

[tool.pylint.main]
ignore-patterns = ["test_.*\\.py", "conftest\\.py"]

[tool.pylint."messages control"]
disable = [
    # 2.7 DesignBuilder iron python compatibility
    "C0209", # consider-using-f-string,
    "W0707", # raise-missing-from
    "R1737", # use-yield-from
    "W1514", # unspecified-encoding
    # Relax the rules, marginal fails, better to disable
    # than specify the full pylint config
    "R0913", # too-many-arguments
    "R0903", # too-few-public-methods
    "R0917", # too-many-positional-arguments
]
